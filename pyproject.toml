[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-extraction-eval-harness"
version = "0.1.0"
description = "Offline deterministic control-profile harness for governed HS legal extraction."
requires-python = ">=3.11"
dependencies = ["pymupdf>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
